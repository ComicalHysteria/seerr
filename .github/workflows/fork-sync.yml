---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Fork Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync-main:
    name: Sync main from upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/seerr-team/seerr.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/main
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.result == 'success'
        run: git push origin main

      - name: Create conflict issue
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = '\u{1F500} Merge conflict: upstream/main \u2192 main';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'merge-conflict',
            });
            const exists = issues.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'A merge conflict was detected during the scheduled sync of `upstream/main` into `main`.',
                  '',
                  'Please resolve manually:',
                  '```bash',
                  'git remote add upstream https://github.com/seerr-team/seerr.git',
                  'git fetch upstream',
                  'git checkout main',
                  'git merge upstream/main',
                  '# resolve conflicts, then:',
                  'git push',
                  '```',
                ].join('\n'),
                labels: ['merge-conflict'],
              });
            }

  sync-develop:
    name: Sync develop from upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/seerr-team/seerr.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream/develop
        id: merge
        run: |
          if git merge upstream/develop --no-edit; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.result == 'success'
        run: git push origin develop

      - name: Create conflict issue
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = '\u{1F500} Merge conflict: upstream/develop \u2192 develop';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'merge-conflict',
            });
            const exists = issues.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'A merge conflict was detected during the scheduled sync of `upstream/develop` into `develop`.',
                  '',
                  'Please resolve manually:',
                  '```bash',
                  'git remote add upstream https://github.com/seerr-team/seerr.git',
                  'git fetch upstream',
                  'git checkout develop',
                  'git merge upstream/develop',
                  '# resolve conflicts, then:',
                  'git push',
                  '```',
                ].join('\n'),
                labels: ['merge-conflict'],
              });
            }
